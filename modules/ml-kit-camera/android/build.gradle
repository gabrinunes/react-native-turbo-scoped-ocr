plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
  id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21'
}

group = 'expo.modules.mlkitcamera'
version = '0.1.0'

android {
  namespace "expo.modules.mlkitcamera"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles 'consumer-rules.pro'
  }
  lintOptions {
    abortOnError false
  }

  // 👇 PASSO 1: Habilitar os recursos de compilação do Jetpack Compose
  buildFeatures {
    compose true
  }
}

dependencies {
  // Mantido idêntico ao que você já tinha
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  def camerax_version = "1.4.0"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"

  // 👇 PASSO 3: Adicionar as dependências de UI e renderização do Compose
  def compose_version = "1.7.5"
  implementation "androidx.compose.ui:ui:$compose_version"
  implementation "androidx.compose.material3:material3:1.3.1"
  implementation "androidx.compose.ui:ui-tooling-preview:$compose_version"

  // Essencial para renderizar a PreviewView da câmera dentro do Compose
  implementation "androidx.compose.ui:ui-viewbinding:$compose_version"
  debugImplementation "androidx.compose.ui:ui-tooling:1.7.5"
}
